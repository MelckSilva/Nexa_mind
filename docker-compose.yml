services:
  postgres:
    image: postgres:15-alpine
    container_name: nexamind-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexamind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexamind"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nexamind-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nexamind
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: llama-3.1-8b-instant
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      CHROMA_PATH: ai/data/chroma
      CHUNK_SIZE: 1000
      CHUNK_OVERLAP: 150
      RAG_TOP_K: 4
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/backend/uploads
      - chroma_data:/app/ai/data/chroma

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: nexamind-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
  chroma_data:
